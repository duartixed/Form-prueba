name: Lighthouse CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Start server
        run: npm start &

      - name: Run Lighthouse
        run: npm run lighthouse
